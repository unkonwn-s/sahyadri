---
# FILE: photos.html
# PURPOSE: Photo gallery page — year/album selector with lightbox-style image grid.
# Entries come from _data/photos.yml (drive_id/album_link/title/date/
# date_display per album), looped and sorted newest-first here via
# Liquid, rather than being hardcoded as individual <figure> blocks.
# This lets Pages CMS (see .pages.yml) offer a real "Add entry" form
# for new albums instead of requiring someone to hand-edit this file's
# HTML. See CONTENT-GUIDE.md for how to add an album either way.
layout: page
title: Photos
subtitle: Click on thumbnail to open the album
---

<!-- Page-specific CSS previously here has been moved to custom-styles.css:
     .sub-nav-options/.sub-nav-list (section: shared sub-nav bar, also used
     by videos.html), .photos-album-grid/.photos-album-item (section: PHOTOS
     PAGE, renamed with a photos-album- prefix since the shared .album-grid/
     .album-item classes are used elsewhere for a slightly different sizing),
     .load-more-container/.btn-load-more/.hidden-item (already existed as
     shared utility classes), and .photos-page-container (section 8; the
     stale flex/sidebar version of this rule left over from an old layout
     has been replaced there with this page's current block/centered style). -->

<!-- Main Page HTML Markup Structure -->
<div class="photos-page-container">

    <!-- Top Navigation Bar (Dynamically populated with Academic Years via JavaScript) -->
    <nav class="sub-nav-options">
        <ul class="sub-nav-list" id="year-toc"></ul>
    </nav>

    <!-- Main Album Grid Container -->
    <div class="photos-album-grid" id="main-grid">

        {%- assign sorted_photos = site.data.photos | sort: "date" | reverse -%}
        {%- for album in sorted_photos -%}
        <figure class="photos-album-item" data-img="{{ album.drive_id }}">
            <a href="{{ album.album_link }}" target="_blank">
                <img src="" alt="{{ album.title | escape }}">
            </a>
            <figcaption>{{ album.title }}, {{ album.date_display }}</figcaption>
        </figure>
        {%- endfor -%}
        

    </div>

    <!-- Pagination Trigger Container -->
    <div class="load-more-container">
        <button id="load-more-btn" class="btn-load-more">Load More</button>
    </div>

</div>

<!-- JavaScript Engine: Handles Google Drive Image Resolution, Dynamic AY Tabs, Filtering, and Pagination -->
<script>
    // Max number of album items displayed per page view
    const ITEMS_PER_PAGE = 12;

    // Month name map used for parsing dates out of album figcaptions
    const MONTHS = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    /**
     * Helper function to build direct thumbnail URL from a Google Drive File ID.
     * @param {string} fileId - The Google Drive file ID.
     * @returns {string} Direct image thumbnail link.
     */
    function driveImg(fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w600`;
    }

    /**
     * Calculates the Academic Year (June–May calendar cycle) from a text string.
     * @param {string} dateText - Raw text from the figcaption element (e.g. "28th June 2026").
     * @returns {string} Academic year formatted string (e.g. "2026-27").
     */
    function getAcademicYear(dateText) {
        const yearMatch = dateText.match(/\d{4}/);
        const monthMatch = dateText.match(/(January|February|March|April|May|June|July|August|September|October|November|December)/i);

        if (!yearMatch || !monthMatch) return "Unknown";

        const year = parseInt(yearMatch[0]);
        const monthIndex = MONTHS.findIndex(m => m.toLowerCase() === monthMatch[0].toLowerCase());

        // Academic year cycle runs from June (index 5) to May (index 4)
        return monthIndex >= 5
            ? `${year}-${(year + 1).toString().slice(-2)}`
            : `${year - 1}-${year.toString().slice(-2)}`;
    }

    /**
     * Manages 'Load More' button state and pagination chunking.
     * @param {Array<HTMLElement>} matchedItems - List of album items belonging to active academic year.
     */
    function updateLoadMore(matchedItems) {
        const btn = document.getElementById('load-more-btn');
        const hidden = matchedItems.filter(el => el.classList.contains('hidden-item'));

        // Toggle visibility of the Load More button based on remaining hidden items
        btn.parentElement.style.display = hidden.length > 0 ? 'block' : 'none';

        // Reveal the next batch of items upon clicking 'Load More'
        btn.onclick = () => {
            hidden.splice(0, ITEMS_PER_PAGE).forEach(el => el.classList.remove('hidden-item'));
            updateLoadMore(matchedItems);
        };
    }

    /**
     * Filters visible album items based on selected academic year tab.
     * @param {string} year - Selected academic year string (e.g., "2025-26").
     * @param {HTMLElement} activeEl - Tab list element clicked by user.
     */
    function filterByYear(year, activeEl) {
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Update active tab highlighting
        document.querySelectorAll('.sub-nav-list li').forEach(li => li.classList.remove('active'));
        activeEl?.classList.add('active');

        // Filter album items matching target academic year
        const all = Array.from(document.querySelectorAll('.photos-album-item'));
        const matched = all.filter(el => el.dataset.academicYear === year);

        // Hide all items, then reveal only the first chunk of matched items
        all.forEach(el => el.classList.add('hidden-item'));
        matched.slice(0, ITEMS_PER_PAGE).forEach(el => el.classList.remove('hidden-item'));

        // Re-evaluate pagination button state
        updateLoadMore(matched);
    }

    /**
     * Initializes thumbnails, parses academic years, creates navigation tabs, and loads default view.
     */
    function initPage() {
        const items = Array.from(document.querySelectorAll('.photos-album-item'));
        const nav = document.getElementById('year-toc');
        const years = new Set();

        items.forEach(item => {
            // Set thumbnail img src from data-img Google Drive ID attribute
            const fileId = item.dataset.img;
            if (fileId && fileId !== 'FILE_ID_HERE') {
                item.querySelector('img').src = driveImg(fileId);
            }

            // Extract academic year and attach as a data attribute on the DOM element
            const year = getAcademicYear(item.querySelector('figcaption').innerText);
            item.dataset.academicYear = year;
            years.add(year);
        });

        // Sort academic years in descending order (most recent first)
        const sortedYears = Array.from(years).sort().reverse();

        // Dynamically build navigation tab buttons
        sortedYears.forEach(year => {
            const li = document.createElement('li');
            li.innerText = year;
            li.onclick = () => filterByYear(year, li);
            nav.appendChild(li);
        });

        // Default to displaying the most recent academic year
        if (sortedYears.length > 0) {
            filterByYear(sortedYears[0], nav.firstChild);
        }
    }

    // Run initialization once DOM content is fully loaded
    document.addEventListener('DOMContentLoaded', initPage);
</script>
