<!-- Interactive Client-side Script for Filtering, Pagination, and Video Embedding -->
<script>
    // Maximum items to display initially and per batch
    const ITEMS_PER_PAGE = 12;

    // Month lookup map used for academic year calculation
    const MONTHS = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    /**
     * Parses the caption text to extract month/year and compute academic session (June–May cycle)
     * @param {string} dateText - Raw figcaption inner text (e.g., "5th March 2026")
     * @returns {string} Academic year formatted string (e.g., "2025-26")
     */
    function getAcademicYear(dateText) {
        const monthMatch = dateText.match(/(January|February|March|April|May|June|July|August|September|October|November|December)/i);
        const yearMatch = dateText.match(/\d{4}/);

        if (!monthMatch || !yearMatch) return "Unknown";

        const year = parseInt(yearMatch[0]);
        const monthIndex = MONTHS.findIndex(m => m.toLowerCase() === monthMatch[0].toLowerCase());

        // Academic year runs June (index 5) through May (index 4)
        return monthIndex >= 5
            ? `${year}-${(year + 1).toString().slice(-2)}`
            : `${year - 1}-${year.toString().slice(-2)}`;
    }

    /**
     * Controls visibility of the "Load More" button and handles pagination batches
     * @param {Array<HTMLElement>} matchedItems - Array of video element nodes matching active year
     */
    function updateLoadMore(matchedItems) {
        const btn = document.getElementById('load-more-btn');
        const hidden = matchedItems.filter(el => el.classList.contains('hidden-item'));

        // Hide button container if no hidden items remain
        btn.parentElement.style.display = hidden.length > 0 ? 'block' : 'none';

        // Reveal the next batch of items on button click
        btn.onclick = () => {
            hidden.splice(0, ITEMS_PER_PAGE).forEach(el => el.classList.remove('hidden-item'));
            updateLoadMore(matchedItems);
        };
    }

    /**
     * Filters grid items based on selected Academic Year
     * @param {string} year - Selected academic year string
     * @param {HTMLElement} activeEl - LI element clicked in navigation bar
     */
    function filterVideos(year, activeEl) {
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Update active navigation state styling
        document.querySelectorAll('.sub-nav-list li').forEach(li => li.classList.remove('active'));
        activeEl?.classList.add('active');

        const all = Array.from(document.querySelectorAll('.videos-page-item'));
        const matched = all.filter(el => el.dataset.academicYear === year);

        // Hide all items, then unhide the first page chunk of matched items
        all.forEach(el => el.classList.add('hidden-item'));
        matched.slice(0, ITEMS_PER_PAGE).forEach(el => el.classList.remove('hidden-item'));

        updateLoadMore(matched);
    }

    /**
     * Replaces thumbnail container with autoplay YouTube iframe embed
     * @param {HTMLElement} container - The clicked .videos-page-wrapper element
     */
    function loadVideo(container) {
        const videoId = container.dataset.video;
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                                frameborder="0" allow="autoplay; encrypted-media"
                                allowfullscreen style="width:100%; height:100%;"></iframe>`;
    }

    /**
     * Scans videos, assigns metadata attributes, builds navigation, and initializes initial view
     */
    function initPage() {
        const items = Array.from(document.querySelectorAll('.videos-page-item'));
        const nav = document.getElementById('year-toc');
        const years = new Set();

        // Assign data-academic-year attribute to each figure element
        items.forEach(item => {
            const year = getAcademicYear(item.querySelector('figcaption').innerText);
            item.dataset.academicYear = year;
            years.add(year);
        });

        // Sort academic years in reverse chronological order
        const sortedYears = Array.from(years).sort().reverse();

        // Build navigation menu dynamically
        sortedYears.forEach(year => {
            const li = document.createElement('li');
            li.innerText = year;
            li.onclick = () => filterVideos(year, li);
            nav.appendChild(li);
        });

        // Set default view to latest academic year
        if (sortedYears.length > 0) {
            filterVideos(sortedYears[0], nav.firstChild);
        }
    }

    // Run initialization once DOM is fully rendered
    document.addEventListener('DOMContentLoaded', initPage);
</script>
