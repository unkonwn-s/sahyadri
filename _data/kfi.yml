# _data/kfi.yml — Krishnamurti/Weekly Excerpts entries for kfi.html
# Each entry: year (must match one of the tabs in year_blocks near the
# top of kfi.html -- unlike Videos/Photos this is NOT auto-computed,
# since a new academic year's tab still needs a one-line manual add
# there), date (for the Mon DD, YYYY caption text and sort order
# within a year), youtube_id (omit entirely for a document-only entry
# with no embedded video), and links (one or more {text, url} pairs --
# most entries have just one, but some link both a video and a
# separate related document/playlist).
# Order in this file doesn't matter -- kfi.html sorts by date
# (newest first) within each year at render time.

