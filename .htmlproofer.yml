# html-proofer configuration for Sahyadri Connect
# https://github.com/gjtorikian/html-proofer

# Don't check external URLs (slow, unreliable in CI)
disable_external: true

# Allow anchor-only hrefs like href="#section"
allow_hash_href: true

# Ignore these URL patterns
ignore_urls:
  - /^#/         # bare anchors
  - /^mailto:/   # email links
  - /^tel:/      # phone links

# Ignore these files from all checks:
# - feed.xml: not HTML, will fail any HTML check
# - photos/index.html: img src="" are JS-populated via data-img attribute
# - profiles/index.html: img src="${p.image}" is a JS template literal
ignore_files:
  - "./_site/feed.xml"
  - "./_site/photos/index.html"
  - "./_site/profiles/index.html"

# Only check links and scripts — not images
# (Google Drive CDN URLs are external and would all fail with disable_external)
checks:
  - Links
  - Scripts

# Ignore missing internal profile links generated by post.html for authors
# who don't have a profile page yet (subtitle → /profiles/slug/ links)
ignore_missing_alt: true

# Swap URL prefix — Jekyll builds with baseurl, strip it for local checks
swap_urls:
  "^/sahyadri": ""
