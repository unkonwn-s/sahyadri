# GitHub Actions: Build & deploy Jekyll site to GitHub Pages
name: Sahyadri Connect

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Cancel any in-progress run for the same branch so rapid pushes
# don't queue up multiple simultaneous deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Validate the built HTML — catches broken tags, missing images,
      # and bad internal links before they reach production.
      - name: Lint HTML output
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --ignore-urls "/^#/" \
            --ignore-files "/./_site/feed.xml/" \
            --checks "Images,Links,Scripts" \
            --allow-hash-href
        continue-on-error: false

      - uses: actions/upload-pages-artifact@v4

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
