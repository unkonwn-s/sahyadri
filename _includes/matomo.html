<!-- FILE: _includes/matomo.html — Matomo (self-hosted analytics) tracking snippet, enabled via site.matomo front matter. -->
{% if site.matomo %}
  <!-- Matomo Analytics -->
  <script type="text/javascript">
    var _paq = _paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    
    (function() {
      // Build tracking endpoint URL using configured domain URI
      var u="//{{- site.matomo.uri -}}/";
      _paq.push(['setTrackerUrl', u+'piwik.php']);
      _paq.push(['setSiteId', '{{- site.matomo.site_id -}}']);
      
      // Asynchronously inject the tracking script into the DOM
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.type='text/javascript'; g.async=true; g.defer=true; g.src=u+'piwik.js'; 
      s.parentNode.insertBefore(g,s);
    })();
  </script>
  <!-- End Matomo Analytics Code -->
{% endif %}
