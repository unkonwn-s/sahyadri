<!-- FILE: _includes/commentbox.html — CommentBox.io comment widget embed (renders in Shadow DOM — not stylable via site CSS). -->
{% if site.commentbox-id %}
  <!-- CommentBox.io widget
       Project ID is set via commentbox-id in _config.yml.
       page.comments is already checked by the parent comments.html include.
  -->
  <div class="commentbox"></div>
  <script src="https://unpkg.com/commentbox.io/dist/commentBox.min.js"></script>
  <script>commentBox('{{ site.commentbox-id }}');</script>
{% endif %}
