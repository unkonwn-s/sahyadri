<!-- FILE: _includes/mathjax.html — MathJax script loader for rendering LaTeX math notation, enabled via page.mathjax front matter. -->
{% if page.mathjax %}
<!-- Configure MathJax options to skip code blocks and raw scripts -->
<script type="text/javascript">
  MathJax = {
    options: {
      skipHtmlTags: [
        'script', 'noscript', 'style', 'textarea', 'pre', 'code'
      ]
    }
  };
</script>

<!-- Asynchronously load the MathJax library with TeX and MathML support -->
<script type="text/javascript" async src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
{% endif %}
