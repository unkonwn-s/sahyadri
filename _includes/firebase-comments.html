<!-- FILE: _includes/firebase-comments.html — Firebase-backed comments widget
     (Google sign-in + Firestore, scoped to the current page URL).
     page.comments is already checked by the parent comments.html include.
     Requires firebase-project-id (and the other firebase-* config keys
     below) to be set in _config.yml, or this include renders nothing. -->
{% if site.firebase-api-key and site.firebase-project-id %}

<style>
  #comments-section {
    --sc-sage: #7C9473;
    --sc-sage-dark: #5F7857;
    --sc-ink: #2B2B28;
    --sc-muted: #767268;
    --sc-line: #E3E0D8;

    max-width: 640px;
    margin: 3em auto 2em;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--sc-ink);
  }

  #comments-section h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.6em;
    font-weight: 400;
    margin: 0 0 1em;
    color: var(--sc-ink);
  }

  #comments-auth {
    display: flex;
    align-items: center;
    gap: 1em;
    margin-bottom: 1.5em;
  }

  .sc-btn {
    font-family: inherit;
    font-size: 0.85em;
    letter-spacing: 0.03em;
    background: #fff;
    color: var(--sc-ink);
    border: 1px solid var(--sc-ink);
    padding: 0.65em 1.4em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .sc-btn:hover {
    background: var(--sc-sage);
    border-color: var(--sc-sage);
    color: #fff;
  }

  .sc-btn:disabled {
    opacity: 0.5;
    cursor: default;
    background: #fff;
    color: var(--sc-ink);
    border-color: var(--sc-line);
  }

  .sc-btn-ghost {
    border-color: var(--sc-line);
    color: var(--sc-muted);
    padding: 0.5em 1em;
    font-size: 0.8em;
  }

  .sc-btn-ghost:hover {
    background: transparent;
    border-color: var(--sc-ink);
    color: var(--sc-ink);
  }

  #comments-user-info {
    display: flex;
    align-items: center;
    gap: 0.8em;
    font-size: 0.9em;
    color: var(--sc-muted);
  }

  #comments-user-info strong {
    color: var(--sc-ink);
    font-weight: 600;
  }

  #comments-form {
    margin-bottom: 2.5em;
  }

  #comments-textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95em;
    line-height: 1.5;
    color: var(--sc-ink);
    border: 1px solid var(--sc-line);
    padding: 0.9em;
    resize: vertical;
    min-height: 5.5em;
  }

  #comments-textarea:focus {
    outline: none;
    border-color: var(--sc-sage);
  }

  #comments-form .sc-btn {
    margin-top: 0.75em;
  }

  #comments-feed {
    border-top: 1px solid var(--sc-line);
  }

  #comments-loading,
  .sc-empty,
  .sc-error {
    color: var(--sc-muted);
    font-style: italic;
    font-size: 0.9em;
    padding: 1.5em 0;
    margin: 0;
  }

  .sc-comment {
    display: flex;
    gap: 0.9em;
    padding: 1.3em 0;
    border-bottom: 1px solid var(--sc-line);
  }

  .sc-avatar {
    flex: none;
    width: 2.3em;
    height: 2.3em;
    border-radius: 50%;
    background: var(--sc-sage);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 0.95em;
    font-weight: 600;
    overflow: hidden;
  }

  .sc-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .sc-comment-body {
    flex: 1;
    min-width: 0;
  }

  .sc-comment-head {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    flex-wrap: wrap;
  }

  .sc-comment-name {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 1em;
    color: var(--sc-ink);
  }

  .sc-comment-time {
    font-size: 0.78em;
    color: var(--sc-muted);
  }

  .sc-comment-text {
    margin: 0.35em 0 0;
    font-size: 0.95em;
    line-height: 1.55;
    color: var(--sc-ink);
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  @media (max-width: 480px) {
    #comments-auth {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>

<div id="comments-section">
  <h3>Comments</h3>

  <div id="comments-auth">
    <button id="comments-login-btn" class="sc-btn">Sign in with Google to comment</button>
    <span id="comments-user-info" style="display:none;">
      Signed in as <strong id="comments-user-name"></strong>
      <button id="comments-logout-btn" class="sc-btn sc-btn-ghost">Sign out</button>
    </span>
  </div>

  <div id="comments-form" style="display:none;">
    <textarea id="comments-textarea" placeholder="Add a comment..."></textarea>
    <br>
    <button id="comments-submit-btn" class="sc-btn">Post comment</button>
  </div>

  <div id="comments-feed">
    <p id="comments-loading">Loading comments…</p>
  </div>
</div>

<!-- Firebase SDKs via CDN (v10 modular, loaded as ES modules — no build tools needed) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Pulled from _config.yml so the config lives in one place, same pattern
  // as site.elfsight-app-id for the other comments provider.
  const firebaseConfig = {
    apiKey: "{{ site.firebase-api-key }}",
    authDomain: "{{ site.firebase-auth-domain }}",
    projectId: "{{ site.firebase-project-id }}",
    storageBucket: "{{ site.firebase-storage-bucket }}",
    messagingSenderId: "{{ site.firebase-messaging-sender-id }}",
    appId: "{{ site.firebase-app-id }}"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const pageUrl = window.location.origin + window.location.pathname;

  const loginBtn = document.getElementById("comments-login-btn");
  const logoutBtn = document.getElementById("comments-logout-btn");
  const userInfo = document.getElementById("comments-user-info");
  const userNameEl = document.getElementById("comments-user-name");
  const formEl = document.getElementById("comments-form");
  const textarea = document.getElementById("comments-textarea");
  const submitBtn = document.getElementById("comments-submit-btn");
  const feedEl = document.getElementById("comments-feed");
  const loadingEl = document.getElementById("comments-loading");

  let currentUser = null;

  loginBtn.addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => {
      console.error("Sign-in failed:", err);
      alert("Sign-in failed. Please try again.");
    });
  });

  logoutBtn.addEventListener("click", () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginBtn.style.display = "none";
      userInfo.style.display = "flex";
      userNameEl.textContent = user.displayName || user.email;
      formEl.style.display = "block";
    } else {
      loginBtn.style.display = "inline-block";
      userInfo.style.display = "none";
      formEl.style.display = "none";
    }
  });

  submitBtn.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text || !currentUser) return;

    submitBtn.disabled = true;
    try {
      await addDoc(collection(db, "comments"), {
        text: text,
        pageUrl: pageUrl,
        uid: currentUser.uid,
        name: currentUser.displayName || "Anonymous",
        photoURL: currentUser.photoURL || null,
        createdAt: serverTimestamp()
      });
      textarea.value = "";
    } catch (err) {
      console.error("Failed to post comment:", err);
      alert("Could not post comment. Please try again.");
    } finally {
      submitBtn.disabled = false;
    }
  });

  const commentsQuery = query(
    collection(db, "comments"),
    where("pageUrl", "==", pageUrl),
    orderBy("createdAt", "desc")
  );

  onSnapshot(
    commentsQuery,
    (snapshot) => {
      loadingEl.style.display = "none";

      if (snapshot.empty) {
        feedEl.innerHTML = '<p class="sc-empty">No comments yet. Be the first to share your thoughts.</p>';
        return;
      }

      const html = snapshot.docs.map((doc) => {
        const data = doc.data();
        const date = data.createdAt
          ? formatDate(data.createdAt.toDate())
          : "just now";
        const safeName = escapeHtml(data.name || "Anonymous");
        const safeText = escapeHtml(data.text || "");
        const initial = safeName.trim().charAt(0).toUpperCase() || "?";
        const avatar = data.photoURL
          ? `<img src="${escapeHtml(data.photoURL)}" alt="">`
          : initial;

        return `
          <div class="sc-comment">
            <div class="sc-avatar">${avatar}</div>
            <div class="sc-comment-body">
              <div class="sc-comment-head">
                <span class="sc-comment-name">${safeName}</span>
                <span class="sc-comment-time">${date}</span>
              </div>
              <p class="sc-comment-text">${safeText}</p>
            </div>
          </div>
        `;
      }).join("");

      feedEl.innerHTML = html;
    },
    (err) => {
      console.error("Failed to load comments:", err);
      loadingEl.className = "sc-error";
      loadingEl.textContent = "Could not load comments. Please try again later.";
    }
  );

  function formatDate(date) {
    return date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }) + " at " + date.toLocaleTimeString(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
{% endif %}
