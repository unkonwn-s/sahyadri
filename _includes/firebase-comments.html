<!-- FILE: _includes/firebase-comments.html — Firebase-backed comments widget
     (Google sign-in + Firestore, scoped to the current page URL).
     page.comments is already checked by the parent comments.html include.
     Requires firebase-project-id (and the other firebase-* config keys
     below) to be set in _config.yml, or this include renders nothing.
     Styling lives in assets/css/custom-styles.css (section 35), matching
     the site's actual theme colors/fonts and dark-mode conventions,
     rather than a separate palette hardcoded here. -->
{% if site.firebase-api-key and site.firebase-project-id %}


<div id="comments-section">
  <h3>Comments</h3>

  <div id="comments-auth">
    <button id="comments-login-btn" class="sc-btn">Sign in with Google to comment</button>
    <span id="comments-user-info" style="display:none;">
      Signed in as <strong id="comments-user-name"></strong>
      <button id="comments-logout-btn" class="sc-btn sc-btn-ghost">Sign out</button>
    </span>
  </div>

  <div id="comments-form" style="display:none;">
    <textarea id="comments-textarea" placeholder="Add a comment..."></textarea>
    <br>
    <button id="comments-submit-btn" class="sc-btn">Post comment</button>
  </div>

  <div id="comments-feed">
    <p id="comments-loading">Loading comments…</p>
  </div>
</div>

<!-- Firebase SDKs via CDN (v10 modular, loaded as ES modules — no build tools needed) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Pulled from _config.yml so the config lives in one place, same pattern
  // as site.elfsight-app-id for the other comments provider.
  const firebaseConfig = {
    apiKey: "{{ site.firebase-api-key }}",
    authDomain: "{{ site.firebase-auth-domain }}",
    projectId: "{{ site.firebase-project-id }}",
    storageBucket: "{{ site.firebase-storage-bucket }}",
    messagingSenderId: "{{ site.firebase-messaging-sender-id }}",
    appId: "{{ site.firebase-app-id }}"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const pageUrl = window.location.origin + window.location.pathname;

  const loginBtn = document.getElementById("comments-login-btn");
  const logoutBtn = document.getElementById("comments-logout-btn");
  const userInfo = document.getElementById("comments-user-info");
  const userNameEl = document.getElementById("comments-user-name");
  const formEl = document.getElementById("comments-form");
  const textarea = document.getElementById("comments-textarea");
  const submitBtn = document.getElementById("comments-submit-btn");
  const feedEl = document.getElementById("comments-feed");
  const loadingEl = document.getElementById("comments-loading");

  let currentUser = null;

  loginBtn.addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((err) => {
      console.error("Sign-in failed:", err);
      alert("Sign-in failed. Please try again.");
    });
  });

  logoutBtn.addEventListener("click", () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginBtn.style.display = "none";
      userInfo.style.display = "flex";
      userNameEl.textContent = user.displayName || user.email;
      formEl.style.display = "block";
    } else {
      loginBtn.style.display = "inline-block";
      userInfo.style.display = "none";
      formEl.style.display = "none";
    }
  });

  submitBtn.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text || !currentUser) return;

    submitBtn.disabled = true;
    try {
      await addDoc(collection(db, "comments"), {
        text: text,
        pageUrl: pageUrl,
        uid: currentUser.uid,
        name: currentUser.displayName || "Anonymous",
        photoURL: currentUser.photoURL || null,
        createdAt: serverTimestamp()
      });
      textarea.value = "";
    } catch (err) {
      console.error("Failed to post comment:", err);
      alert("Could not post comment. Please try again.");
    } finally {
      submitBtn.disabled = false;
    }
  });

  const commentsQuery = query(
    collection(db, "comments"),
    where("pageUrl", "==", pageUrl),
    orderBy("createdAt", "desc")
  );

  onSnapshot(
    commentsQuery,
    (snapshot) => {
      loadingEl.style.display = "none";

      if (snapshot.empty) {
        feedEl.innerHTML = '<p class="sc-empty">No comments yet. Be the first to share your thoughts.</p>';
        return;
      }

      const html = snapshot.docs.map((doc) => {
        const data = doc.data();
        const date = data.createdAt
          ? formatDate(data.createdAt.toDate())
          : "just now";
        const safeName = escapeHtml(data.name || "Anonymous");
        const safeText = escapeHtml(data.text || "");
        const initial = safeName.trim().charAt(0).toUpperCase() || "?";
        const avatar = data.photoURL
          ? `<img src="${escapeHtml(data.photoURL)}" alt="">`
          : initial;

        return `
          <div class="sc-comment">
            <div class="sc-avatar">${avatar}</div>
            <div class="sc-comment-body">
              <div class="sc-comment-head">
                <span class="sc-comment-name">${safeName}</span>
                <span class="sc-comment-time">${date}</span>
              </div>
              <p class="sc-comment-text">${safeText}</p>
            </div>
          </div>
        `;
      }).join("");

      feedEl.innerHTML = html;
    },
    (err) => {
      console.error("Failed to load comments:", err);
      loadingEl.className = "sc-error";
      loadingEl.textContent = "Could not load comments. Please try again later.";
    }
  );

  function formatDate(date) {
    return date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    }) + " at " + date.toLocaleTimeString(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
{% endif %}
