<!-- FILE: _includes/fb-comment.html — Facebook Comments plugin embed, enabled via site.fb_comment_id in _config.yml. -->
{%- if site.fb_comment_id -%}
<div class="comments">
  <!-- Facebook SDK root element required for social plugin initialization -->
  <div id="fb-root"></div>
  <script>
    // Asynchronously load and initialize the Facebook JavaScript SDK
    (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return; // Prevent duplicate script injection
      js = d.createElement(s); js.id = id;
      // Load Facebook SDK with specified version and configured App ID
      js.src = 'https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v2.12&appId={{ site.fb_comment_id }}&autoLogAppEvents=1';
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));
  </script>

  <!-- Container element that renders the Facebook Comments thread for the page's canonical URL -->
  <div class="fb-comments" data-href="{{ page.url | absolute_url }}" data-width="100%" data-numposts="5"></div>

  <!-- Fallback message displayed when JavaScript is disabled -->
  <noscript>Please enable JavaScript to view the comments powered by Facebook.</noscript>
</div>
{%- endif -%}
