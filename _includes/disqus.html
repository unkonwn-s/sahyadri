<!-- FILE: _includes/disqus.html — Disqus comment system embed, enabled via site.disqus-shortname in _config.yml. -->
{%- if site.disqus -%}
<div class="disqus-comments">
  <div class="comments">
    <!-- Container where the Disqus comment widget will be injected -->
    <div id="disqus_thread"></div>
    <script type="text/javascript">
      // Set the Disqus shortname from site configuration
      var disqus_shortname = '{{ site.disqus }}';

      // Strip query strings from URL to keep comment threads unified (e.g., example.com/page?ref=1 -> example.com/page)
      var url_parts = window.location.href.split("?");
      var disqus_url = url_parts[0];

      // Dynamically load the Disqus embed script asynchronously
      (function() {
        var dsq = document.createElement('script');
        dsq.type = 'text/javascript';
        dsq.async = true;
        dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
      })();
    </script>
    <!-- Fallback message for users with JavaScript disabled -->
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  </div>
</div>
{%- endif -%}
