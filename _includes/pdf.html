<!-- FILE: _includes/pdf.html — Embeds a PDF viewer for a given file (see usage example in the layout that calls it). -->
<div class="pdf-container">
  <div class="pdf-thumbnail">
    <!-- Downloadable link pointing to the PDF file path -->
    <a href="{{ include.pdf_path | relative_url }}" target="_blank" download>
      <!-- Preview thumbnail image for the PDF -->
      <img 
        src="{{ include.thumbnail_path | relative_url }}" 
        alt="Download PDF"
      >
    </a>
  </div>
</div>
