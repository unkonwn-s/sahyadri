<!-- FILE: _includes/comments.html — Renders the configured comment system (Giscus/Disqus/etc per _config.yml). -->
{% if page.comments %}
  <!-- Load Disqus commenting system -->
  {% include disqus.html %}
  <!-- Load Facebook Comments plugin -->
  {% include fb-comment.html %}
  <!-- Load Staticman comment engine -->
  {% include staticman-comments.html %}
  <!-- Load Utterances GitHub issue-based comments -->
  {% include utterances-comment.html %}
  <!-- Load Giscus GitHub Discussions-based comments -->
  {% include giscus-comment.html %}
  <!-- Load CommentBox.io widget (only if a Project ID is configured) -->
  {% if site.commentbox-id %}
    {% include commentbox.html %}
  {% endif %}
{% endif %}
